<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block page_title %}標案通知系統{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',500:'#6366f1',600:'#4f46e5',700:'#4338ca' }
          }
        }
      }
    }
  </script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

<!-- Toast system (wraps full page) -->
<div class="flex min-h-screen" x-data="toastSystem()">

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside class="w-60 bg-gray-900 text-white flex flex-col fixed inset-y-0 left-0 z-20">
    <div class="px-5 py-5 border-b border-gray-700 flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-brand-600 rounded-lg flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <div>
          <p class="font-bold text-sm leading-tight">標案通知系統</p>
          <p class="text-xs text-gray-400 mt-0.5">政府採購自動追蹤</p>
        </div>
      </div>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="/"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors
                {{ 'bg-gray-700 text-white' if active=='dashboard' else 'text-gray-300 hover:bg-gray-800 hover:text-white' }}">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0
               00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        所有專案
      </a>
      <a href="/logs"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors
                {{ 'bg-gray-700 text-white' if active=='logs' else 'text-gray-300 hover:bg-gray-800 hover:text-white' }}">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0
               01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        系統 Log
      </a>
      <a href="/settings"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors
                {{ 'bg-gray-700 text-white' if active=='settings' else 'text-gray-300 hover:bg-gray-800 hover:text-white' }}">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826
               2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0
               00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924
               1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0
               00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31
               2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        設定
      </a>
    </nav>
    <div class="px-5 py-4 border-t border-gray-700 text-xs text-gray-500">
      資料來源：
      <a href="https://web.pcc.gov.tw" target="_blank" class="text-gray-400 hover:text-white transition-colors">政府電子採購網</a>
    </div>
  </aside>

  <!-- ── Main (each page owns its own header + content + x-data scope) ────── -->
  <div class="ml-60 flex-1 flex flex-col min-h-screen">
    {% block page %}{% endblock %}
  </div>

  <!-- ── Toast ────────────────────────────────────────────────────────────── -->
  <div x-cloak x-show="show"
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="opacity-0 translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-end="opacity-0 translate-y-1"
       :class="type==='error' ? 'bg-red-600' : 'bg-green-600'"
       class="fixed bottom-6 right-6 z-50 text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-medium min-w-[220px]">
    <span x-text="message"></span>
    <button @click="show=false" class="ml-auto opacity-70 hover:opacity-100 text-lg leading-none">✕</button>
  </div>

</div>

<script>
  function toastSystem() {
    return {
      show: false, message: '', type: 'success',
      init() {
        window.addEventListener('show-toast', e => {
          this.message = e.detail.message;
          this.type    = e.detail.type || 'success';
          this.show    = true;
          setTimeout(() => { this.show = false; }, 3500);
        });
      }
    }
  }
  function toast(msg, type = 'success') {
    window.dispatchEvent(new CustomEvent('show-toast', { detail: { message: msg, type } }));
  }
  async function apiCall(method, url, body = null) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${res.status}`);
    }
    return res.status === 204 ? null : res.json();
  }
</script>
{% block scripts %}{% endblock %}

</body>
</html>
