{% extends "base.html" %}
{% block page_title %}系統 Log – 標案通知系統{% endblock %}

{% block page %}
<div x-data="logsPage()" x-init="init()" class="flex-1 flex flex-col min-h-screen">

  <!-- Top bar -->
  <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between sticky top-0 z-10">
    <h1 class="text-lg font-semibold text-gray-900">系統 Log</h1>
    <div class="flex items-center gap-3">
      <!-- Date selector -->
      <select x-model="selectedDate" @change="loadLogs()"
        class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
        <template x-for="f in files" :key="f">
          <option :value="f" x-text="f + (f === todayStr ? ' (今天)' : '')"></option>
        </template>
      </select>
      <!-- Lines selector -->
      <select x-model="lines" @change="loadLogs()"
        class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
        <option value="200">最後 200 行</option>
        <option value="400">最後 400 行</option>
        <option value="1000">最後 1000 行</option>
        <option value="9999">全部</option>
      </select>
      <!-- Auto refresh toggle -->
      <button @click="toggleAutoRefresh()"
        :class="autoRefresh ? 'bg-green-100 text-green-700 border-green-300' : 'bg-gray-100 text-gray-600 border-gray-200'"
        class="text-sm border rounded-lg px-3 py-1.5 flex items-center gap-1.5 transition-colors">
        <span class="w-2 h-2 rounded-full" :class="autoRefresh ? 'bg-green-500 animate-pulse' : 'bg-gray-400'"></span>
        <span x-text="autoRefresh ? '自動更新中' : '自動更新'"></span>
      </button>
      <!-- Refresh button -->
      <button @click="loadLogs()"
        class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
        <svg class="w-4 h-4" :class="loading ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        重新整理
      </button>
      <!-- Scroll to bottom -->
      <button @click="scrollToBottom()"
        class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 hover:bg-gray-50 transition-colors">
        ↓ 到底部
      </button>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-1 px-8 py-6 flex flex-col">

    <!-- Stats bar -->
    <div class="flex items-center gap-4 mb-4 text-xs text-gray-500">
      <span x-show="totalLines > 0">
        共 <span class="font-medium text-gray-700" x-text="totalLines"></span> 行，
        顯示最後 <span class="font-medium text-gray-700" x-text="showing"></span> 行
      </span>
      <span x-show="error" class="text-red-500" x-text="error"></span>
      <span x-show="lastRefresh" class="ml-auto">
        最後更新：<span x-text="lastRefresh"></span>
      </span>
    </div>

    <!-- Legend -->
    <div class="flex items-center gap-4 mb-3 text-xs">
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span> SUCCESS</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span> INFO</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-yellow-500"></span> WARNING</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-500"></span> ERROR</span>
    </div>

    <!-- Log box -->
    <div id="log-box"
         class="flex-1 bg-gray-950 rounded-xl p-5 overflow-auto font-mono text-xs leading-relaxed"
         style="min-height: 60vh; max-height: 75vh;">
      <div x-show="loading && lines_html.length === 0" class="text-gray-500 animate-pulse">載入中…</div>
      <div x-show="!loading && lines_html.length === 0 && !error" class="text-gray-500">目前沒有 log 資料</div>
      <template x-for="(line, idx) in lines_html" :key="idx">
        <div x-html="line" class="whitespace-pre-wrap break-all leading-5 hover:bg-gray-900 px-1 rounded"></div>
      </template>
    </div>

  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
const TODAY = new Date().toISOString().slice(0, 10);

function logsPage() {
  return {
    files: [], selectedDate: '', todayStr: TODAY,
    lines: '400', lines_html: [],
    loading: false, error: '', totalLines: 0, showing: 0,
    autoRefresh: false, _timer: null, lastRefresh: '',

    async init() {
      await this.loadLogs();
    },

    async loadLogs() {
      this.loading = true;
      this.error = '';
      try {
        const params = new URLSearchParams({ lines: this.lines });
        if (this.selectedDate) params.set('date', this.selectedDate);
        const data = await apiCall('GET', `/api/logs?${params}`);

        this.files = data.files || [];
        if (!this.selectedDate && data.date) this.selectedDate = data.date;
        if (data.error) { this.error = data.error; this.lines_html = []; return; }

        this.totalLines = data.total_lines || 0;
        this.showing    = data.showing || 0;
        this.lines_html = this.parseLog(data.content || '');
        this.lastRefresh = new Date().toLocaleTimeString('zh-TW');

        // Auto scroll to bottom if near bottom
        this.$nextTick(() => {
          const box = document.getElementById('log-box');
          if (box && (box.scrollHeight - box.scrollTop - box.clientHeight < 200)) {
            this.scrollToBottom();
          }
        });
      } catch(e) {
        this.error = '載入失敗：' + e.message;
      } finally {
        this.loading = false;
      }
    },

    parseLog(raw) {
      if (!raw) return [];
      return raw.split('\n').filter(l => l.trim()).map(line => {
        // Color-code by log level
        if (line.includes('| SUCCESS ') || line.includes('| SUCCESS|')) {
          return `<span class="text-green-400">${this.esc(line)}</span>`;
        } else if (line.includes('| ERROR   ') || line.includes('| ERROR|') || line.includes('| CRITICAL')) {
          return `<span class="text-red-400 font-semibold">${this.esc(line)}</span>`;
        } else if (line.includes('| WARNING ') || line.includes('| WARNING|')) {
          return `<span class="text-yellow-400">${this.esc(line)}</span>`;
        } else if (line.includes('| INFO    ') || line.includes('| INFO|')) {
          return `<span class="text-blue-300">${this.esc(line)}</span>`;
        } else if (line.includes('| DEBUG   ') || line.includes('| DEBUG|')) {
          return `<span class="text-gray-500">${this.esc(line)}</span>`;
        } else {
          return `<span class="text-gray-300">${this.esc(line)}</span>`;
        }
      });
    },

    esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    },

    scrollToBottom() {
      this.$nextTick(() => {
        const box = document.getElementById('log-box');
        if (box) box.scrollTop = box.scrollHeight;
      });
    },

    toggleAutoRefresh() {
      this.autoRefresh = !this.autoRefresh;
      if (this.autoRefresh) {
        this._timer = setInterval(() => this.loadLogs(), 30000);
      } else {
        clearInterval(this._timer);
        this._timer = null;
      }
    },
  }
}
</script>
{% endblock %}
